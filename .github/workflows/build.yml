name: Fabriquer l'APK Nova

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fabriquer l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nova.apk

      - name: Mettre l'APK à disposition (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Nova-APK
          path: nova.apk

      - name: Publier l'APK (onglet Releases, lien direct pour la télé)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nova 1.0.${{ github.run_number }}
          files: nova.apk
          make_latest: true
